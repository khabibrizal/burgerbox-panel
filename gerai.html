<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BurgerBox — Laporan Gerai</title>
<!--
  Halaman PEMILIK GERAI. Terpisah dari `index.template.html` yang untuk Super Admin, dan
  terpisahnya disengaja: yang boleh dilihat keduanya sama sekali berbeda, dan satu halaman
  bercabang-peran adalah satu tempat di mana cabang yang salah membocorkan data seluruh gerai
  kepada satu pemiliknya.

  Nilai https://fpyamxztplpbiszttfoi.supabase.co dan eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZweWFteHp0cGxwYmlzenR0Zm9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjU3MzcsImV4cCI6MjEwMjI0MTczN30.CiRinf7qLQx6Xtx0OSqLKb9mP8pVhFs16enCzyy4sG0 disuntik `scripts/unggah-panel.mjs` dari
  `.env.local`. Anon key memang aman tayang: RLS menyala tanpa policy, jadi ia tidak dapat membaca
  satu baris pun. Seluruh data lewat `gerai-data`, yang memeriksa kepemilikan.

  Dirancang untuk PONSEL lebih dulu. Pemilik membacanya sambil di jalan, bukan di meja — itu
  seluruh gunanya halaman ini ada.
-->
<style>
  :root {
    --bg: #faf8f5; --kartu: #fff; --tepi: #e6e0d8; --teks: #2b2622; --redup: #7a6f66;
    --aksen: #b4541e; --hijau: #2f7d4f; --merah: #b3261e; --biru: #1e4f8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1815; --kartu: #241f1b; --tepi: #3a332c; --teks: #f0ebe4; --redup: #a89c91;
      --aksen: #e8843f; --hijau: #6fce93; --merah: #ff8a80; --biru: #7fb3f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--teks);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--kartu); border-bottom: 1px solid var(--tepi);
    padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .kartu {
    background: var(--kartu); border: 1px solid var(--tepi); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .angka { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .angka div { background: var(--kartu); border: 1px solid var(--tepi); border-radius: 10px; padding: 12px; }
  .angka .label { font-size: 12px; color: var(--redup); }
  .angka .nilai { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .angka .ket { font-size: 12px; color: var(--redup); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--tepi); }
  th { font-size: 12px; color: var(--redup); font-weight: 600; }
  td.kanan, th.kanan { text-align: right; }
  tr.trx { cursor: pointer; }
  tr.trx:hover td { background: rgba(180, 84, 30, .06); }
  .void { color: var(--merah); font-weight: 600; }
  .redup { color: var(--redup); }
  button {
    font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--tepi);
    background: var(--kartu); color: var(--teks); cursor: pointer;
  }
  button.utama { background: var(--aksen); border-color: var(--aksen); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input, select {
    font: inherit; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--tepi); background: var(--bg); color: var(--teks); width: 100%;
  }
  .pesan { padding: 10px 12px; border-radius: 8px; background: rgba(30,79,138,.12); margin-bottom: 12px; }
  .pesan.galat { background: rgba(179,38,30,.14); color: var(--merah); }
  .sembunyi { display: none !important; }
  .baris { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .baris > label { flex: 1; min-width: 130px; font-size: 12px; color: var(--redup); }
  #masuk { max-width: 340px; margin: 48px auto; }
  #masuk label { display: block; margin-bottom: 10px; font-size: 13px; color: var(--redup); }
  .rincian td { border: 0; padding: 3px 6px; font-size: 13px; }
  caption { text-align: left; font-weight: 600; padding: 6px; }
</style>
</head>
<body>

<header class="sembunyi" id="kepala">
  <h1 id="namaGerai">Laporan Gerai</h1>
  <select id="pilihGerai" class="sembunyi" style="width:auto"></select>
  <span class="redup" id="emailku"></span>
  <button id="keluar">Keluar</button>
</header>

<main>
  <div id="pesan"></div>

  <section id="masuk" class="kartu">
    <h2 style="margin-top:0;font-size:16px">Masuk — Pemilik Gerai</h2>
    <label>Email
      <input id="email" type="email" autocomplete="username" inputmode="email">
    </label>
    <label>Sandi
      <input id="sandi" type="password" autocomplete="current-password">
    </label>
    <button class="utama" id="tombolMasuk" style="width:100%">Masuk</button>
    <p class="redup" style="font-size:12px">
      Akun dibuat oleh admin BurgerBox. Halaman ini hanya menampilkan penjualan gerai Anda.
    </p>
  </section>

  <div id="isi" class="sembunyi">
    <div class="angka" id="ringkas"></div>
    <div class="kartu" id="kartuTagihan"></div>

    <div class="kartu" id="kartuKas"></div>

    <div class="kartu" id="kartuKonflik"></div>

    <div class="kartu" id="kartuMaster"></div>

    <div class="kartu" id="kartuPengguna"></div>

    <div class="kartu">
      <div class="baris" style="margin-bottom:10px">
        <label>Dari<input id="dari" type="date"></label>
        <label>Sampai<input id="sampai" type="date"></label>
        <button id="tombolFilter">Tampilkan</button>
      </div>
      <div id="daftarTrx"><p class="redup">Memuat…</p></div>
      <div class="baris" style="margin-top:10px;justify-content:space-between">
        <button id="sebelumnya">← Sebelumnya</button>
        <span class="redup" id="posisi"></span>
        <button id="berikutnya">Berikutnya →</button>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const URL_SUPABASE = 'https://fpyamxztplpbiszttfoi.supabase.co'
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZweWFteHp0cGxwYmlzenR0Zm9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjU3MzcsImV4cCI6MjEwMjI0MTczN30.CiRinf7qLQx6Xtx0OSqLKb9mP8pVhFs16enCzyy4sG0'
const sb = createClient(URL_SUPABASE, ANON)

const $ = (id) => document.getElementById(id)
const rupiah = (n) => 'Rp ' + Number(n).toLocaleString('id-ID')

/**
 * Meloloskan teks agar aman disisipkan ke HTML. **WAJIB untuk setiap nilai yang datang dari
 * server**, tanpa kecuali.
 *
 * Di halaman ini nilainya termasuk nama kasir, nama channel, dan nama produk — ketiganya diketik
 * di tablet gerai, dan tidak satu pun disaring bentuknya di sana. Nama produk berisi
 * `<img src=x onerror=…>` akan menjalankan skrip di halaman ini, dengan sesi pemiliknya.
 *
 * Diloloskan juga nilai yang "pasti aman" seperti nominal dan tanggal: aturan yang punya
 * pengecualian akan dipakai salah oleh orang berikutnya yang menambah baris di sini, dan ia tidak
 * akan tahu nilai mana yang termasuk pengecualian.
 */
const lolos = (v) => String(v ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#39;')

function pesan(teks, galat = false) {
  $('pesan').innerHTML = teks ? `<div class="pesan ${galat ? 'galat' : ''}">${lolos(teks)}</div>` : ''
}

/** Memanggil `gerai-data` dengan JWT sesi. Seluruh data hanya lewat sini. */
async function panggil(isi) {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) throw new Error('Sesi habis. Masuk lagi.')
  const r = await fetch(`${URL_SUPABASE}/functions/v1/gerai-data`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ ...isi, tenantId: terpilih }),
  })
  const badan = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(badan.error || `HTTP ${r.status}`)
  return badan
}

/**
 * Memanggil `gerai-master` — endpoint TERPISAH dari `gerai-data`, dan pemisahan itu disengaja.
 *
 * `gerai-data` hanya BACA, dan KDoc-nya menyatakan itu sebagai penjagaan: satu-satunya penulis
 * penjualan adalah tablet gerai. Menambahkan jalur tulis ke sana akan membatalkan pernyataan tersebut
 * untuk seluruh endpoint, termasuk aksi-aksi yang memang tidak boleh punya jalur tulis sama sekali.
 */
async function panggilMaster(isi) {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) throw new Error('Sesi habis. Masuk lagi.')
  const r = await fetch(`${URL_SUPABASE}/functions/v1/gerai-master`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ ...isi, tenantId: terpilih }),
  })
  const badan = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(badan.error || `HTTP ${r.status}`)
  return badan
}

/** Gerai yang sedang dilihat. `null` berarti "yang pertama", ditentukan server. */
let terpilih = null
let halaman = 0

/** `YYYY-MM-DD HH.MM` menurut WIB — jam yang sama dengan yang tertera di nota tablet. */
function waktuWib(iso) {
  const d = new Date(iso)
  const w = new Date(d.getTime() + 7 * 3600000)
  const p = (n) => String(n).padStart(2, '0')
  return `${w.getUTCFullYear()}-${p(w.getUTCMonth() + 1)}-${p(w.getUTCDate())} ` +
    `${p(w.getUTCHours())}.${p(w.getUTCMinutes())}`
}

function kartuAngka(label, nilai, ket) {
  return `<div><div class="label">${lolos(label)}</div>` +
    `<div class="nilai">${lolos(nilai)}</div>` +
    (ket ? `<div class="ket">${lolos(ket)}</div>` : '') + '</div>'
}

async function muatRingkas() {
  const d = await panggil({ aksi: 'ringkas' })
  terpilih = d.terpilih
  $('namaGerai').textContent = d.nama
  $('emailku').textContent = d.email

  // Pemilih gerai hanya muncul bila memang punya lebih dari satu. Dropdown berisi satu pilihan
  // adalah kontrol yang menuntut perhatian tanpa menawarkan keputusan.
  const pilih = $('pilihGerai')
  if (d.gerai.length > 1) {
    pilih.innerHTML = d.gerai
      .map((g) => `<option value="${lolos(g.id)}"${g.id === d.terpilih ? ' selected' : ''}>${lolos(g.nama)}</option>`)
      .join('')
    pilih.classList.remove('sembunyi')
  }

  $('ringkas').innerHTML = [
    kartuAngka('Omzet hari ini', rupiah(d.hariIni.omzet), `${d.hariIni.trx} transaksi · ${d.hariIni.tanggal}`),
    kartuAngka('7 hari terakhir', rupiah(d.tujuhHari.omzet)),
    kartuAngka(
      'Siklus berjalan',
      rupiah(d.siklusIni.omzet),
      `${d.siklusIni.trx} transaksi` + (d.siklusIni.dibatalkan ? ` · ${d.siklusIni.dibatalkan} dibatalkan` : ''),
    ),
    kartuAngka(
      'Pengeluaran siklus ini',
      rupiah(d.pengeluaran?.total ?? 0),
      d.pengeluaran?.otomatis
        ? `termasuk ${rupiah(d.pengeluaran.otomatis)} potongan platform`
        : undefined,
    ),
    // **Disebut laba KOTOR, bukan "laba".** Ia belum dikurangi tagihan langganan, dan pemilik yang
    // membacanya sebagai uang yang bebas diambil akan menyiapkan nominal yang salah.
    kartuAngka(
      'Laba kotor siklus ini',
      rupiah(d.labaKotor ?? 0),
      'omzet bersih − pengeluaran, belum dikurangi langganan',
    ),
    kartuAngka('Status gerai', d.status === 'active' ? 'Aktif' : 'Terkunci', `Siklus s/d ${d.siklus.akhir}`),
  ].join('')

  $('kartuTagihan').innerHTML = isiTagihan(d)
}

function isiTagihan(d) {
  if (d.tagihan.length > 0) {
    return d.tagihan.map((t) => {
      const baris = [
        ['Omzet bersih ' + t.periodeAwal + ' s/d ' + t.periodeAkhir, rupiah(t.omzetTotal)],
        [`Tarif langganan ${t.persen}%`, rupiah(t.fee)],
      ]
      // Baris koreksi hanya bila ada — dan menyebut arahnya, sebab bagi pemilik "dikembalikan"
      // dan "baru tertagih" adalah dua kejadian yang sangat berbeda.
      if (t.koreksi !== 0) {
        baris.push([
          t.koreksi < 0 ? 'Koreksi: penjualan periode lalu yang dibatalkan'
            : 'Koreksi: penjualan periode lalu yang baru tersinkron',
          (t.koreksi < 0 ? '−' : '+') + rupiah(Math.abs(t.koreksi)),
        ])
      }
      baris.push(['<b>Tagihan</b>', '<b>' + rupiah(t.total) + '</b>'])
      return `<h2 style="margin:0 0 8px;font-size:15px">Tagihan belum lunas — jatuh tempo ${lolos(t.jatuhTempo)}</h2>` +
        '<table class="rincian">' +
        baris.map(([k, v]) => `<tr><td>${k.startsWith('<b>') ? k : lolos(k)}</td>` +
          `<td class="kanan">${v.startsWith('<b>') ? v : lolos(v)}</td></tr>`).join('') +
        '</table>' +
        '<p class="redup" style="font-size:12px;margin-bottom:0">Pembayaran dan unggah bukti dilakukan dari tablet gerai.</p>'
    }).join('<hr>')
  }

  if (!d.perkiraan) return '<p class="redup" style="margin:0">Belum ada tagihan.</p>'

  // Disebut PERKIRAAN, bukan "tagihan". Omzet siklus ini masih dapat berubah sampai siklusnya
  // tutup; menyebutnya tagihan membuat pemilik menyiapkan nominal yang belum tentu benar.
  return '<h2 style="margin:0 0 8px;font-size:15px">Perkiraan tagihan siklus ini</h2>' +
    '<table class="rincian">' +
    `<tr><td>Omzet bersih siklus berjalan</td><td class="kanan">${lolos(rupiah(d.perkiraan.omzet))}</td></tr>` +
    `<tr><td>Tarif langganan ${lolos(d.perkiraan.persen)}%</td>` +
    `<td class="kanan">${lolos(rupiah(d.perkiraan.nominal))}</td></tr>` +
    '</table>' +
    '<p class="redup" style="font-size:12px;margin-bottom:0">' +
    'Angka ini masih berjalan — tagihan resminya terbit saat siklus tutup.</p>'
}

async function muatKas() {
  const d = await panggil({
    aksi: 'kas',
    dari: $('dari').value || undefined,
    sampai: $('sampai').value || undefined,
  })

  const bagian = []

  if (d.laci.length > 0) {
    bagian.push(
      '<h2 style="margin:0 0 8px;font-size:15px">Hitungan laci</h2>' +
      '<table><thead><tr><th>Tanggal</th><th>Penjaga</th>' +
      '<th class="kanan">Seharusnya</th><th class="kanan">Terhitung</th>' +
      '<th class="kanan">Selisih</th></tr></thead><tbody>' +
      d.laci.map((l) => `
        <tr>
          <td>${lolos(l.tanggal)}</td>
          <td>${lolos(l.penjaga ?? l.dicatatOleh)}</td>
          <td class="kanan">${lolos(rupiah(l.seharusnya))}</td>
          <td class="kanan">${lolos(rupiah(l.terhitung))}</td>
          <td class="kanan">${selisihKas(l.selisih)}</td>
        </tr>`).join('') +
      '</tbody></table>',
    )
  }

  if (d.pengeluaran.length > 0) {
    bagian.push(
      '<h2 style="margin:14px 0 8px;font-size:15px">Pengeluaran</h2>' +
      '<table><thead><tr><th>Waktu</th><th>Kategori</th><th>Catatan</th>' +
      '<th>Sumber</th><th class="kanan">Nominal</th></tr></thead><tbody>' +
      d.pengeluaran.map((k) => `
        <tr>
          <td>${lolos(waktuWib(k.terjadiPada))}</td>
          <td>${lolos(k.kategori)}${k.otomatis ? ' <span class="redup">(otomatis)</span>' : ''}</td>
          <td>${lolos(k.catatan)}</td>
          <td>${k.sumber === 'laci' ? 'Laci kasir' : 'Lainnya'}</td>
          <td class="kanan">${lolos(rupiah(k.nominal))}</td>
        </tr>`).join('') +
      '</tbody></table>',
    )
  }

  $('kartuKas').innerHTML = bagian.length > 0
    ? bagian.join('')
    : '<p class="redup" style="margin:0">Belum ada catatan kas pada rentang ini.</p>'
}

/**
 * Selisih kas, DIBERI WARNA dan TANDA.
 *
 * Nol ditulis "pas", bukan "Rp 0": angka nol di kolom selisih terbaca seperti data yang belum masuk,
 * sementara "pas" menyatakan bahwa hitungannya memang cocok.
 *
 * Warna BUKAN satu-satunya penanda — tandanya (− / +) ikut, sebab yang sulit membedakan warna tetap
 * harus dapat membaca arah selisihnya. Kelas cacat yang sudah menggigit proyek ini di pemilih sumber
 * pengeluaran.
 */
function selisihKas(n) {
  if (n === 0) return '<span class="redup">pas</span>'
  const kelas = n < 0 ? 'void' : ''
  const tanda = n < 0 ? '\u2212' : '+'
  return `<span class="${kelas}">${lolos(tanda + rupiah(Math.abs(n)))}</span>`
}

/** Data master terakhir yang dimuat, dipakai formulir ubah tanpa memanggil server lagi. */
let master = { jenis: [], produk: [], channel: [], pengguna: [], konflik: [], bekuKarenaBentrok: 0 }

async function muatMaster() {
  master = await panggilMaster({ aksi: 'baca' })
  isiKonflik()
  isiMaster()
  isiPengguna()
}

/**
 * Kartu PENGGUNA — kasir dan admin gerai.
 *
 * **Tidak ada apa pun soal PIN di kartu ini, dan itu keputusan pemilik yang diambil dengan sadar.**
 * PIN kasir 4-6 digit; hash-nya dapat ditebak habis dalam milidetik bila bocor, jadi bahannya tidak
 * pernah meninggalkan tablet. Yang dapat dilakukan dari sini: mengganti nama dan MENONAKTIFKAN. Yang
 * tidak: menambah kasir baru dan me-reset PIN — keduanya harus disentuh di tablet.
 *
 * Kalimat itu ditulis DI HALAMAN, bukan cuma di kode. Pemilik yang mencari tombol "tambah kasir" lalu
 * tidak menemukannya akan menyimpulkan halamannya rusak; yang membaca sebabnya tahu harus ke tablet.
 */
function isiPengguna() {
  const daftar = master.pengguna || []
  const ownerAktif = daftar.filter((p) => p.peran === 'owner' && p.aktif).length

  const baris = daftar.map((p) => {
    // Owner aktif TERAKHIR tidak boleh dinonaktifkan: tabletnya akan kehilangan satu-satunya orang yang
    // berhak mengelola pengguna, dan pemulihannya menuntut pasang ulang beserta kehilangan data. Server
    // menolaknya juga; tombol yang mati di sini hanya supaya pemilik tidak menekan sesuatu yang pasti
    // gagal. Yang MENJAGA adalah server dan tablet, bukan tombol ini.
    const ownerTerakhir = p.peran === 'owner' && p.aktif && ownerAktif <= 1
    return '<tr' + (p.aktif ? '' : ' class="redup"') + '>' +
      `<td>${lolos(p.nama)}</td>` +
      `<td>${lolos(p.peran)}</td>` +
      `<td>${p.aktif ? 'aktif' : '<span class="void">nonaktif</span>'}</td>` +
      `<td class="redup">${lolos(p.diubah_oleh)} \u00b7 ${lolos(waktuWib(p.diubah_pada))}</td>` +
      '<td>' +
      `<button class="ubahPengguna" data-uid="${lolos(p.uid)}">Ubah nama</button> ` +
      (ownerTerakhir
        ? '<button disabled title="Minimal satu owner aktif harus tetap ada">Nonaktifkan</button>'
        : `<button class="aktifPengguna" data-uid="${lolos(p.uid)}" data-aktif="${p.aktif ? '0' : '1'}">` +
          `${p.aktif ? 'Nonaktifkan' : 'Aktifkan'}</button>`) +
      '</td></tr>'
  }).join('')

  $('kartuPengguna').innerHTML =
    '<h2 style="margin:0 0 4px;font-size:15px">Pengguna tablet</h2>' +
    '<p class="redup" style="margin:0 0 12px">Dari sini Anda dapat mengganti nama dan ' +
    '<b>menonaktifkan</b> \u2014 kasir yang nonaktif tidak dapat login lagi. <b>PIN tidak ada di sini ' +
    'dan tidak pernah dikirim ke server</b>, jadi menambah kasir baru dan me-reset PIN harus dilakukan ' +
    'di tablet. Peran juga hanya dapat diubah di tablet.</p>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Nama</th><th>Peran</th><th>Status</th>' +
    '<th>Terakhir diubah</th><th></th></tr></thead>' +
    `<tbody>${baris}</tbody></table></div>` +
    '<div id="formPengguna" class="sembunyi" style="margin-top:10px"></div>'
}

/** Formulir pengguna: HANYA nama. Peran dan PIN tidak dapat diubah dari panel. */
function bukaFormulirPengguna(uid) {
  const p = (master.pengguna || []).find((x) => x.uid === uid)
  if (!p) return
  $('formPengguna').innerHTML =
    '<div class="baris" style="flex-wrap:wrap;gap:8px">' +
    `<label>Nama<input name="nama" type="text" value="${lolos(p.nama)}"></label>` +
    `<button class="simpanPengguna" data-uid="${lolos(uid)}">Simpan</button>` +
    '<button class="batalPengguna">Batal</button></div>'
  $('formPengguna').classList.remove('sembunyi')
}

async function simpanPengguna(tombol, ubah) {
  tombol.disabled = true
  try {
    const h = await panggilMaster({ aksi: 'tulis', tabel: 'pengguna', baris: ubah })
    if (!h.tersimpan) {
      pesan('Perubahan TIDAK tersimpan: sudah ada perubahan yang lebih baru dari tablet.', true)
    } else {
      pesan('Tersimpan. Akan masuk ke tablet saat aplikasi kasir dibuka.')
    }
    await muatMaster()
  } catch (e) {
    pesan(e.message, true)
  } finally {
    tombol.disabled = false
  }
}

/**
 * Kartu KONFLIK — bagian yang membuat kebekuan sinkronisasi TERLIHAT.
 *
 * Sebelum ini, satu nama produk yang kembar antara panel dan tablet membekukan seluruh aliran data
 * master ke gerai itu, dan kebekuannya tidak terlihat siapa pun: angkanya dihitung di tablet lalu
 * dibuang oleh pemicunya. Pemilik hanya melihat harga yang tidak pernah berubah, tanpa sebab.
 *
 * Ditaruh DI ATAS kartu master, bukan di bawahnya: peringatan yang berada di bawah formulir dibaca
 * sesudah orangnya menekan Simpan, yaitu sesudah ia menyimpulkan perubahannya berhasil.
 */
function isiKonflik() {
  const aktif = (master.konflik || []).filter((k) => !k.selesai_pada)
  const beres = (master.konflik || []).filter((k) => k.selesai_pada)

  if (aktif.length === 0 && beres.length === 0) {
    $('kartuKonflik').classList.add('sembunyi')
    return
  }
  $('kartuKonflik').classList.remove('sembunyi')

  const bentrokAktif = aktif.filter((k) => k.jenis === 'bentrok_nama')
  const bagian = []

  if (bentrokAktif.length > 0) {
    // **Kalimatnya menyebut AKIBATNYA, bukan hanya keadaannya.** "Ada 1 konflik" tidak memberi tahu
    // pemilik bahwa perubahan harganya yang lain pun tidak sampai ke kasir — dan itulah yang
    // membuatnya menunggu alih-alih memperbaiki.
    bagian.push(
      '<h2 style="margin:0 0 8px;font-size:15px">\u26a0 Perubahan belum sampai ke kasir</h2>' +
      `<p style="margin:0 0 10px">Ada <b>${bentrokAktif.length} nama yang kembar</b> antara panel dan ` +
      'tablet. Selama ini belum dibereskan, <b>semua</b> perubahan data master berhenti di server dan ' +
      'tidak masuk ke layar kasir \u2014 termasuk perubahan yang tidak ada hubungannya dengan nama ini. ' +
      'Ganti salah satu namanya (di panel ini atau di tablet), lalu buka aplikasi di tablet.</p>',
    )
  }

  const baris = (k) => {
    const kapan = k.selesai_pada ? `beres ${waktuWib(k.selesai_pada)}` : `terakhir ${waktuWib(k.terakhir_pada)}`
    const label = k.jenis === 'bentrok_nama' ? 'nama kembar' : 'perubahan tertimpa'
    return '<tr' + (k.selesai_pada ? ' class="redup"' : '') + '>' +
      `<td>${lolos(k.nama || '(tanpa nama)')}</td>` +
      `<td>${lolos(label)}</td>` +
      `<td>${lolos(NAMA_TABEL[k.tabel] || k.tabel)}</td>` +
      `<td>${lolos(kapan)}</td>` +
      `<td>${lolos(k.jumlah)}\u00d7</td>` +
      `<td class="redup">${lolos(k.keterangan || '')}</td></tr>`
  }

  bagian.push(
    '<div style="overflow-x:auto"><table><thead><tr><th>Nama</th><th>Masalah</th><th>Tabel</th>' +
    '<th>Kapan</th><th>Kali</th><th>Keterangan</th></tr></thead><tbody>' +
    [...aktif, ...beres].map(baris).join('') +
    '</tbody></table></div>',
  )

  $('kartuKonflik').innerHTML = bagian.join('')
}

const NAMA_TABEL = {
  m_jenis_produk: 'Jenis produk',
  m_produk: 'Produk',
  m_channel: 'Channel',
}

/**
 * Kartu DATA MASTER — harga, nama, urutan, aktif.
 *
 * **Tidak ada tombol Hapus, dan itu bukan kelalaian.** Produk yang sudah dipakai transaksi lama tidak
 * boleh hilang: riwayat penjualan harus tetap terbaca apa adanya, dan foreign key di tablet pun
 * menolaknya. Jalannya menonaktifkan \u2014 barisnya tetap ada, tidak lagi muncul di kasir.
 */
function isiMaster() {
  const opsiJenis = master.jenis
    .map((j) => `<option value="${lolos(j.uid)}">${lolos(j.nama)}</option>`).join('')

  const barisProduk = master.produk.map((p) => {
    const jenisNama = (master.jenis.find((j) => j.uid === p.jenis_uid) || {}).nama || '\u2014'
    return '<tr>' +
      `<td>${lolos(p.nama)}</td>` +
      `<td>${lolos(jenisNama)}</td>` +
      `<td style="text-align:right">${lolos(rupiah(p.harga))}</td>` +
      `<td>${p.aktif ? 'aktif' : '<span class="void">nonaktif</span>'}</td>` +
      // `diubah_oleh` DITAMPILKAN: saat pemilik melihat harga yang bukan yang ia isi, yang pertama
      // perlu ia ketahui adalah siapa yang terakhir mengubahnya \u2014 tablet atau panel.
      `<td class="redup">${lolos(p.diubah_oleh)} \u00b7 ${lolos(waktuWib(p.diubah_pada))}</td>` +
      `<td><button class="ubahProduk" data-uid="${lolos(p.uid)}">Ubah</button></td></tr>`
  }).join('')

  const barisJenis = master.jenis.map((j) =>
    '<tr>' +
    `<td>${lolos(j.nama)}</td>` +
    `<td style="text-align:right">${lolos(j.urutan)}</td>` +
    `<td>${j.aktif ? 'aktif' : '<span class="void">nonaktif</span>'}</td>` +
    `<td class="redup">${lolos(j.diubah_oleh)} \u00b7 ${lolos(waktuWib(j.diubah_pada))}</td>` +
    `<td><button class="ubahJenis" data-uid="${lolos(j.uid)}">Ubah</button></td></tr>`,
  ).join('')

  const barisChannel = master.channel.map((c) =>
    '<tr>' +
    `<td>${lolos(c.nama)}</td>` +
    `<td style="text-align:right">${lolos(c.persen_fee)}%</td>` +
    `<td>${lolos(c.metode_bayar_bawaan)}</td>` +
    `<td>${c.aktif ? 'aktif' : '<span class="void">nonaktif</span>'}</td>` +
    `<td class="redup">${lolos(c.diubah_oleh)} \u00b7 ${lolos(waktuWib(c.diubah_pada))}</td>` +
    `<td><button class="ubahChannel" data-uid="${lolos(c.uid)}">Ubah</button></td></tr>`,
  ).join('')

  $('kartuMaster').innerHTML =
    '<h2 style="margin:0 0 4px;font-size:15px">Data master</h2>' +
    '<p class="redup" style="margin:0 0 12px">Perubahan di sini masuk ke tablet saat aplikasi kasir ' +
    'dibuka. Data tidak dihapus, hanya dinonaktifkan \u2014 riwayat penjualan lama harus tetap terbaca.</p>' +

    '<h3 style="margin:10px 0 6px;font-size:14px">Produk</h3>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Nama</th><th>Jenis</th>' +
    '<th style="text-align:right">Harga</th><th>Status</th><th>Terakhir diubah</th><th></th></tr></thead>' +
    `<tbody>${barisProduk}</tbody></table></div>` +
    `<div id="formProduk" class="sembunyi" style="margin-top:10px"></div>` +
    `<button id="tambahProduk" style="margin-top:8px">+ Produk baru</button>` +

    '<h3 style="margin:16px 0 6px;font-size:14px">Jenis produk</h3>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Nama</th>' +
    '<th style="text-align:right">Urutan</th><th>Status</th><th>Terakhir diubah</th><th></th></tr></thead>' +
    `<tbody>${barisJenis}</tbody></table></div>` +
    `<div id="formJenis" class="sembunyi" style="margin-top:10px"></div>` +
    `<button id="tambahJenis" style="margin-top:8px">+ Jenis baru</button>` +

    '<h3 style="margin:16px 0 6px;font-size:14px">Channel penjualan</h3>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Nama</th>' +
    '<th style="text-align:right">Fee</th><th>Bayar</th><th>Status</th><th>Terakhir diubah</th>' +
    '<th></th></tr></thead>' +
    `<tbody>${barisChannel}</tbody></table></div>` +
    `<div id="formChannel" class="sembunyi" style="margin-top:10px"></div>`

  $('formProduk').dataset.opsi = opsiJenis
}

/** Merakit satu formulir ubah/tambah. Nilai lama diloloskan seperti nilai lain \u2014 ia pun dari server. */
function formulir(tabel, baris) {
  const b = baris || {}
  const medan = []
  const teks = (nama, label, nilai, tipe = 'text') =>
    `<label>${lolos(label)}<input name="${nama}" type="${tipe}" value="${lolos(nilai ?? '')}"></label>`

  medan.push(teks('nama', 'Nama', b.nama))
  if (tabel === 'produk') {
    medan.push(`<label>Jenis<select name="jenisUid">${$('formProduk').dataset.opsi}</select></label>`)
    medan.push(teks('harga', 'Harga (Rp)', b.harga ?? 0, 'number'))
  }
  if (tabel === 'channel') {
    medan.push(teks('persenFee', 'Fee (%)', b.persen_fee ?? 0, 'number'))
    medan.push(
      '<label>Metode bayar<select name="metodeBayarBawaan">' +
      ['tunai', 'qris', 'transfer', 'aplikasi', 'tidak_dicatat']
        .map((m) => `<option value="${m}"${b.metode_bayar_bawaan === m ? ' selected' : ''}>${m}</option>`)
        .join('') +
      '</select></label>',
    )
  }
  medan.push(teks('urutan', 'Urutan', b.urutan ?? 0, 'number'))
  medan.push(
    '<label>Status<select name="aktif">' +
    `<option value="1"${b.aktif === false ? '' : ' selected'}>aktif</option>` +
    `<option value="0"${b.aktif === false ? ' selected' : ''}>nonaktif</option>` +
    '</select></label>',
  )

  return '<div class="baris" style="flex-wrap:wrap;gap:8px">' + medan.join('') +
    `<button class="simpanMaster" data-tabel="${lolos(tabel)}" data-uid="${lolos(b.uid || '')}">Simpan</button>` +
    '<button class="batalMaster">Batal</button></div>'
}

function bukaFormulir(tabel, uid) {
  const kotak = $('form' + tabel[0].toUpperCase() + tabel.slice(1))
  const daftar = tabel === 'produk' ? master.produk : tabel === 'jenis' ? master.jenis : master.channel
  const baris = uid ? daftar.find((x) => x.uid === uid) : null
  kotak.innerHTML = formulir(tabel, baris)
  kotak.classList.remove('sembunyi')
  if (tabel === 'produk' && baris) {
    const sel = kotak.querySelector('select[name=jenisUid]')
    if (sel) sel.value = baris.jenis_uid || ''
  }
}

async function simpanMaster(tombol) {
  const kotak = tombol.closest('div.baris')
  const nilai = (n) => {
    const el = kotak.querySelector(`[name=${n}]`)
    return el ? el.value : undefined
  }
  const tabel = tombol.dataset.tabel
  const uid = tombol.dataset.uid

  const baris = {
    nama: nilai('nama'),
    urutan: Number(nilai('urutan')),
    aktif: nilai('aktif') === '1',
  }
  // `uid` HANYA disertakan bila mengubah. Kosong berarti tambah baru, dan uid-nya dibangkitkan SERVER
  // \u2014 halaman ini tidak pernah menentukan identitas baris.
  if (uid) baris.uid = uid
  if (tabel === 'produk') {
    baris.jenisUid = nilai('jenisUid')
    baris.harga = Number(nilai('harga'))
    // `dirakit` tidak diedit dari panel: ia menentukan apakah penjualan mengurangi stok bahan, dan
    // mengubahnya dari jauh tanpa melihat resepnya membuat stok bahan bergeser tanpa sebab yang
    // terbaca di gerai. Nilai lamanya dipertahankan; produk baru mengikuti bawaan tablet.
    const lama = master.produk.find((p) => p.uid === uid)
    baris.dirakit = lama ? lama.dirakit : true
  }
  if (tabel === 'channel') {
    baris.persenFee = Number(nilai('persenFee'))
    baris.metodeBayarBawaan = nilai('metodeBayarBawaan')
    const lama = master.channel.find((c) => c.uid === uid)
    baris.bawaan = lama ? lama.bawaan : false
  }

  tombol.disabled = true
  try {
    const h = await panggilMaster({ aksi: 'tulis', tabel, baris })
    // **`tersimpan: false` DILAPORKAN, tidak didiamkan.** Ia praktis mustahil (stempel waktunya dari
    // jam server), tetapi yang "praktis mustahil" lalu terjadi tanpa dilaporkan adalah harga yang
    // tidak berubah tanpa sebab \u2014 dan pemilik akan mencoba berulang kali atas sesuatu yang bukan
    // salahnya.
    if (!h.tersimpan) {
      pesan('Perubahan TIDAK tersimpan: sudah ada perubahan yang lebih baru dari tablet.', true)
    } else {
      pesan(h.baru ? 'Ditambahkan. Akan masuk ke tablet saat aplikasi kasir dibuka.'
        : 'Tersimpan. Akan masuk ke tablet saat aplikasi kasir dibuka.')
    }
    await muatMaster()
  } catch (e) {
    pesan(e.message, true)
  } finally {
    tombol.disabled = false
  }
}

async function muatTransaksi() {
  $('daftarTrx').innerHTML = '<p class="redup">Memuat…</p>'
  const d = await panggil({
    aksi: 'transaksi',
    halaman,
    dari: $('dari').value || undefined,
    sampai: $('sampai').value || undefined,
  })

  if (d.transaksi.length === 0) {
    $('daftarTrx').innerHTML = '<p class="redup">Tidak ada transaksi pada rentang ini.</p>'
    $('posisi').textContent = ''
  } else {
    $('daftarTrx').innerHTML =
      '<table><thead><tr><th>Waktu</th><th>Nomor</th><th>Kasir</th><th>Channel</th>' +
      '<th class="kanan">Bersih</th></tr></thead><tbody>' +
      d.transaksi.map((t) => `
        <tr class="trx" data-uid="${lolos(t.uid)}">
          <td>${lolos(waktuWib(t.terjadiPada))}</td>
          <td>${lolos(t.nomor)}${t.status !== 'completed' ? ' <span class="void">DIBATALKAN</span>' : ''}</td>
          <td>${lolos(t.kasir)}</td>
          <td>${lolos(t.channel)}</td>
          <td class="kanan">${lolos(rupiah(t.bersih))}</td>
        </tr>`).join('') +
      '</tbody></table>'

    const awal = d.halaman * d.sehalaman + 1
    const akhir = Math.min(d.jumlah, awal + d.transaksi.length - 1)
    $('posisi').textContent = `${awal}–${akhir} dari ${d.jumlah}`
  }

  $('sebelumnya').disabled = halaman === 0
  $('berikutnya').disabled = (halaman + 1) * d.sehalaman >= d.jumlah
}

/** Membuka rincian item satu transaksi, di bawah barisnya. */
async function bukaItem(tr) {
  const uid = tr.dataset.uid
  const adaSetelahnya = tr.nextElementSibling
  if (adaSetelahnya && adaSetelahnya.classList.contains('isi-item')) {
    adaSetelahnya.remove()
    return
  }
  const d = await panggil({ aksi: 'item', uid })
  const baris = document.createElement('tr')
  baris.className = 'isi-item'
  baris.innerHTML = `<td colspan="5">` +
    (d.item.length === 0
      ? '<span class="redup">Item tidak tercatat.</span>'
      : '<table class="rincian">' + d.item.map((i) => `
          <tr><td>${lolos(i.produk)}</td>
          <td class="kanan">${lolos(i.qty)} × ${lolos(rupiah(i.hargaSatuan))}</td>
          <td class="kanan">${lolos(rupiah(i.subtotal))}</td></tr>`).join('') + '</table>') +
    '</td>'
  tr.after(baris)
}

async function muatSemua() {
  pesan('')
  try {
    await muatRingkas()
    await muatKas()
    // **Master dimuat SEBELUM transaksi.** Kartu konflik yang muncul belakangan berarti pemilik sudah
    // menggulir ke daftar transaksi ketika peringatan "perubahan belum sampai ke kasir" akhirnya
    // tergambar di atas layar — di luar pandangannya.
    await muatMaster()
    await muatTransaksi()
  } catch (e) {
    pesan(e.message, true)
  }
}

function tampilkanMasuk(masuk) {
  $('masuk').classList.toggle('sembunyi', masuk)
  $('isi').classList.toggle('sembunyi', !masuk)
  $('kepala').classList.toggle('sembunyi', !masuk)
}

$('tombolMasuk').addEventListener('click', async () => {
  const tombol = $('tombolMasuk')
  tombol.disabled = true
  pesan('')
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('sandi').value,
    })
    if (error) throw new Error('Email atau sandi salah.')
    $('sandi').value = ''
    tampilkanMasuk(true)
    await muatSemua()
  } catch (e) {
    pesan(e.message, true)
  } finally {
    tombol.disabled = false
  }
})

$('sandi').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('tombolMasuk').click() })

$('keluar').addEventListener('click', async () => {
  await sb.auth.signOut()
  terpilih = null
  tampilkanMasuk(false)
})

$('pilihGerai').addEventListener('change', async (e) => {
  terpilih = e.target.value
  halaman = 0
  await muatSemua()
})

$('tombolFilter').addEventListener('click', async () => {
  halaman = 0
  // Filter tanggalnya berlaku untuk KEDUANYA. Rentang yang hanya mengubah salah satunya membuat
  // pemilik membandingkan penjualan bulan ini dengan pengeluaran bulan lalu — dan menyimpulkan
  // gerainya rugi.
  try {
    await muatKas()
    await muatTransaksi()
  } catch (e) {
    pesan(e.message, true)
  }
})

$('sebelumnya').addEventListener('click', async () => {
  if (halaman > 0) { halaman--; try { await muatTransaksi() } catch (e) { pesan(e.message, true) } }
})
$('berikutnya').addEventListener('click', async () => {
  halaman++
  try { await muatTransaksi() } catch (e) { pesan(e.message, true) }
})

// Delegasi, bukan pemasang per baris: barisnya digambar ulang setiap kali halaman berganti, dan
// pemasang per baris akan menumpuk pendengar pada elemen yang sudah dibuang.
$('daftarTrx').addEventListener('click', async (e) => {
  const tr = e.target.closest('tr.trx')
  if (!tr) return
  try { await bukaItem(tr) } catch (err) { pesan(err.message, true) }
})

// Delegasi juga untuk kartu master: tabel dan formulirnya digambar ulang setiap kali data dimuat,
// jadi pemasang per tombol akan menumpuk pendengar pada elemen yang sudah dibuang.
$('kartuMaster').addEventListener('click', async (e) => {
  const t = e.target
  if (t.classList.contains('ubahProduk')) return bukaFormulir('produk', t.dataset.uid)
  if (t.classList.contains('ubahJenis')) return bukaFormulir('jenis', t.dataset.uid)
  if (t.classList.contains('ubahChannel')) return bukaFormulir('channel', t.dataset.uid)
  if (t.id === 'tambahProduk') return bukaFormulir('produk', null)
  if (t.id === 'tambahJenis') return bukaFormulir('jenis', null)
  if (t.classList.contains('batalMaster')) {
    return t.closest('div[id^=form]').classList.add('sembunyi')
  }
  if (t.classList.contains('simpanMaster')) {
    try { await simpanMaster(t) } catch (err) { pesan(err.message, true) }
  }
})

$('kartuPengguna').addEventListener('click', async (e) => {
  const t = e.target
  if (t.classList.contains('ubahPengguna')) return bukaFormulirPengguna(t.dataset.uid)
  if (t.classList.contains('batalPengguna')) return $('formPengguna').classList.add('sembunyi')
  if (t.classList.contains('simpanPengguna')) {
    const kotak = t.closest('div.baris')
    const nama = kotak.querySelector('[name=nama]').value
    // `aktif` DISERTAKAN apa adanya dari data yang sedang tampil. Menghilangkannya membuat server
    // menerima `aktif: undefined`, validasinya menolak, dan pemilik melihat "aktif wajib boolean" atas
    // penggantian nama yang tidak menyebut aktif sama sekali.
    const p = (master.pengguna || []).find((x) => x.uid === t.dataset.uid)
    return simpanPengguna(t, { uid: t.dataset.uid, nama, aktif: p ? p.aktif : true })
  }
  if (t.classList.contains('aktifPengguna')) {
    const p = (master.pengguna || []).find((x) => x.uid === t.dataset.uid)
    if (!p) return
    return simpanPengguna(t, { uid: p.uid, nama: p.nama, aktif: t.dataset.aktif === '1' })
  }
})

// Sesi yang masih hidup langsung dipakai — pemilik tidak perlu mengetik sandi tiap kali membuka
// halaman ini dari ponselnya.
const { data: { session } } = await sb.auth.getSession()
if (session) {
  tampilkanMasuk(true)
  await muatSemua()
} else {
  tampilkanMasuk(false)
}
</script>
